[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefkasten"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.25,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<2.8",
    "httpx>=0.26,<1",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0,<6",
    "fpdf2>=2.7,<3",
    "pytesseract>=0.3,<1",
    "Pillow>=10.0,<11",
    "opencv-python-headless>=4.8,<5",
    "sqlite-vec>=0.1,<1",
    "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.2,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
